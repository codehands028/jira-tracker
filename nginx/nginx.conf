# Nginx主配置文件
# 用于定义全局设置和引入站点配置
# Jira Tracker 项目专用配置

# 运行Nginx的用户（使用www-data，这是Linux系统中常见的nginx运行用户）
user www-data;

# 工作进程数，设置为auto表示自动根据CPU核心数设置
worker_processes auto;

# 错误日志路径及日志级别（warn表示警告级别及以上）
error_log /var/log/nginx/error.log warn;

# Nginx进程ID文件路径
pid /var/run/nginx.pid;

# 事件处理模块配置
events {
    # 每个工作进程的最大连接数
    worker_connections 1024;
}

# HTTP服务器配置块
http {
    # 包含MIME类型定义文件，用于识别文件类型
    include /etc/nginx/mime.types;

    # 默认的MIME类型
    default_type application/octet-stream;

    # 定义日志格式，命名为main
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 访问日志路径及使用的日志格式
    access_log /var/log/nginx/access.log main;

    # 启用高效文件传输，提高文件传输效率
    sendfile on;

    # 启用tcp_nopush，优化数据包发送
    tcp_nopush on;

    # 客户端与服务器保持连接的超时时间（秒）
    keepalive_timeout 65;

    # 启用gzip压缩，减少传输数据量
    gzip on;

    # 设置gzip压缩的文件类型
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 设置gzip压缩级别（1-9，9为最高压缩率）
    gzip_comp_level 6;

    # 设置启用gzip的最小HTTP响应版本
    gzip_http_version 1.1;

    # 包含站点配置文件，支持两种常见路径
    # 1. /etc/nginx/conf.d/ 目录下所有.conf文件
    include /etc/nginx/conf.d/*.conf;

    # 2. /etc/nginx/sites-enabled/ 目录下所有文件
    include /etc/nginx/sites-enabled/*;
}
